name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-arm64:
    name: Build (macOS Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host architecture
        run: uname -m

      - name: Build release .app
        run: make app

      - name: Package .app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test -d "build/GHPullCounter.app"
          VERSION="${TAG#v}"
          ASSET_BASE="gh-pull-counter-${VERSION}-macos-arm64"
          ditto -c -k --keepParent "build/GHPullCounter.app" "${ASSET_BASE}.zip"
          shasum -a 256 "${ASSET_BASE}.zip" | tee "${ASSET_BASE}.zip.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gh-pull-counter-*-macos-arm64.zip
            gh-pull-counter-*-macos-arm64.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
